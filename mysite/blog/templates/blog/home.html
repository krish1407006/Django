{% extends 'blog/base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Welcome to My Blog</h1>


    <p>this is the home page</p>


    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <small>Created at: {{ post.created_at }}</small>
        </div>
    {% empty %}
        <p>No posts available.</p>
    {% endfor %}

    
{% endblock %}
