{% extends 'blog/base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Welcome to the Blog Home Page</h1>
    <p>name : {{ name }}</p>
    <p>course : {{ course }}</p>
    {% if age >= 18 %}
        <p>you are eligible for voting</p>
    {% else %}
        <p>you are not eligible for voting. age: {{ age }}</p>
    {% endif %}
{% endblock %}
